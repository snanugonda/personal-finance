{% extends "base.html" %}

{% block content %}
    <h2>Edit Asset: {{ asset.name }}</h2>
    <form method="post" class="form-styled">
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" value="{{ asset.name }}" required>
        </div>
        <div>
            <label for="type">Type:</label>
            <input type="text" id="type" name="type" value="{{ asset.type }}" placeholder="e.g., Bank Account, Stocks" required>
        </div>
        <div>
            <label for="value">Value:</label>
            <input type="number" step="0.01" id="value" name="value" value="{{ asset.value }}" required>
        </div>
        <div>
            <input type="submit" value="Save Changes" class="button button-submit"> {# Added class="button" for consistency #}
        </div>
    </form>
    <a href="{{ url_for('index') }}" class="button">Back to Dashboard</a> {# Added class="button" for styling #}
{% endblock %}
